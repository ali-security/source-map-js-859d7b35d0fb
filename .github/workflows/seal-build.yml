name: seal-build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.8.0
      - run: yarn --frozen-lockfile --ignore-engines
      - run: yarn build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: source-map-js-tgz
          path: source-map-js-1.2.1.tgz
